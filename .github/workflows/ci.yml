name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"

jobs:
  no-binaries:
    # Compiled binaries were committed at this repository's first commit and stayed until
    # now. A plain `go build ./...` in the working tree silently overwrites them, so a
    # one-line change would arrive with a 5 MB binary diff attached. Nothing should be
    # reviewable-by-accident; everything should come from source.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Refuse compiled binaries
        run: |
          set +e
          offenders=""
          for f in $(git ls-files); do
            [ -f "$f" ] || continue
            magic=$(head -c 4 "$f" 2>/dev/null | od -An -tx1 | tr -d ' \n')
            if [ "$magic" = "7f454c46" ]; then
              offenders="$offenders $f"
            fi
          done
          if [ -n "$offenders" ]; then
            echo "::error::compiled binaries are tracked in the repository:"
            for f in $offenders; do echo "  $f"; done
            echo "Build them with 'make build' (output goes to ./bin, which is ignored)."
            exit 1
          fi
          echo "no compiled binaries tracked"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        run: go build ./...

  test:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Test
        run: go test ./... -v -count=1 -timeout=300s

  test-race:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Test with race detection
        run: go test -race -short ./... -count=1 -timeout=600s

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go vet
        run: go vet ./...

  audit:
    runs-on: ubuntu-latest
    needs: [build]
    # The SARIF upload needs security-events: write, and the workflow sets no
    # permissions block at all, so without this the token inherits the repository
    # default -- usually read-only -- and the upload step fails with "Resource not
    # accessible by integration". Scoped to this job, since it is the only one that
    # publishes anything.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Security audit
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          # -quiet is deliberately absent. With it, gosec writes no SARIF file at all
          # when there are no findings, so the upload step below fails on a missing
          # artifact and the job goes red on a clean result. Without it the file is always
          # written, and findings go to the file rather than the log anyway.
          gosec -confidence medium -fmt sarif -out gosec.sarif ./...
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4.38.2
        if: always()
        with:
          sarif_file: gosec.sarif

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...