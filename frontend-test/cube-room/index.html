<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cube Room — Gleipnir IPC</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{height:100%;overflow:hidden;background:#f5f0e8;font-family:'Courier New',Consolas,'Liberation Mono',monospace;color:#1a1a1a}
body{
  background-image:
    linear-gradient(rgba(0,0,0,0.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,0,0,0.04) 1px,transparent 1px);
  background-size:20px 20px;
  display:flex;flex-direction:column;
}
.drawing-sheet{flex:1;display:flex;flex-direction:column;max-width:960px;margin:0 auto;width:100%;padding:0 24px}

.title-block{
  border:2px solid #1a1a1a;border-top:none;padding:10px 16px;display:flex;justify-content:space-between;flex-shrink:0;margin-top:12px
}
.title-main{display:flex;gap:24px;align-items:baseline}
.project-name{font-size:16px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.sheet-number{font-size:11px;letter-spacing:1px;opacity:0.6}
.title-sub{font-size:11px;letter-spacing:1px;text-transform:uppercase}

.info-row{display:flex;gap:32px;border:2px solid #1a1a1a;border-top:none;padding:6px 16px;flex-shrink:0;font-size:11px;letter-spacing:0.5px}
.info-item{opacity:0.7}
.info-item span{opacity:1;font-weight:700}
.info-item.online{opacity:1;color:#1a6b3a}
.info-item.offline{opacity:1;color:#8b1a1a}
.info-item.offline span{color:#8b1a1a}

.drawing-area{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:2px solid #1a1a1a;border-top:none;padding:20px;position:relative;min-height:0
}

.cube-wrapper{
  perspective:700px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin:10px 0
}
.cube{
  width:170px;height:170px;position:relative;transform-style:preserve-3d;
  will-change:transform;
}
.face{
  position:absolute;width:170px;height:170px;border:2px solid #1a1a1a;
  background:rgba(245,240,232,0.7);backface-visibility:visible;
  transition:background 0.6s;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;letter-spacing:1px;text-transform:uppercase;color:rgba(26,26,26,0.3)
}
.face.front{transform:translateZ(85px)}
.face.back{transform:rotateY(180deg) translateZ(85px)}
.face.right{transform:rotateY(90deg) translateZ(85px)}
.face.left{transform:rotateY(-90deg) translateZ(85px)}
.face.top{transform:rotateX(-90deg) translateZ(85px)}
.face.bottom{transform:rotateX(90deg) translateZ(85px)}

.face.active{
  background:
    repeating-linear-gradient(45deg,
      transparent,transparent 3px,
      rgba(26,26,26,0.07) 3px,rgba(26,26,26,0.07) 5px),
    rgba(245,240,232,0.85);
  border-width:2.5px;
}
.face.active .face-label{opacity:1;color:#1a1a1a}
.face-label{opacity:0;transition:opacity 0.6s;font-size:10px;font-weight:700;letter-spacing:1px;pointer-events:none}

.annotation-area{
  width:100%;max-width:520px;min-height:110px;flex-shrink:0;
  margin-top:6px;padding:0 8px;position:relative
}
.annotation-connector{
  position:absolute;left:50%;top:-12px;width:2px;height:12px;background:#1a1a1a;
  opacity:0;transition:opacity 0.5s
}
.annotation-connector.visible{opacity:1}
.annotation-connector::after{
  content:'';position:absolute;top:0;left:-3px;
  border-left:4px solid transparent;border-right:4px solid transparent;
  border-top:6px solid #1a1a1a
}
.annotation-box{
  border:2px dashed rgba(26,26,26,0.3);padding:16px 20px;min-height:80px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity 0.4s,transform 0.4s;opacity:0;transform:translateY(8px)
}
.annotation-box.visible{opacity:1;transform:translateY(0)}

.ritual-text{font-size:16px;letter-spacing:0.3px;text-align:center;line-height:1.6}
.ritual-highlight{font-weight:700;border-bottom:1px solid #1a1a1a;padding:0 4px;min-width:60px}
.ritual-input{
  border:none;border-bottom:2px solid #1a1a1a;background:transparent;
  font:inherit;font-size:18px;color:#1a1a1a;outline:none;min-width:200px;
  padding:2px 6px;text-align:center;font-weight:700;letter-spacing:0.5px;
  transition:border-color 0.3s
}
.ritual-input:focus{border-bottom-color:#8b1a1a}
.ritual-input::placeholder{color:rgba(26,26,26,0.25);font-weight:400;font-size:14px;letter-spacing:1px}

.ritual-hint{font-size:11px;opacity:0.4;margin-top:8px;letter-spacing:0.5px;text-align:center}

.covenant-box{
  border:1px solid #1a1a1a;padding:16px 20px;max-width:440px;width:100%
}
.covenant-text{font-size:12px;line-height:1.7;letter-spacing:0.3px;text-align:left;white-space:pre-line;font-family:inherit}
.covenant-title{font-weight:700;text-align:center;font-size:13px;letter-spacing:2px;margin-bottom:10px;text-transform:uppercase}
.covenant-seal{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:12px}
.seal-button{
  width:48px;height:48px;border:2.5px solid #8b1a1a;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:transform 0.3s,background 0.3s;position:relative;
  background:transparent
}
.seal-button:hover{transform:scale(1.1);background:rgba(139,26,26,0.05)}
.seal-button:active{transform:scale(0.95)}
.seal-button.applied{background:rgba(139,26,26,0.1);border-color:#8b1a1a}
.seal-check{color:#8b1a1a;font-size:22px;font-weight:700}
.seal-label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#8b1a1a;cursor:pointer}
.seal-label:hover{text-decoration:underline}

.forge-animation{display:flex;flex-direction:column;align-items:center;gap:8px}
.forge-spinner{display:flex;gap:4px}
.forge-dot{width:6px;height:6px;background:#1a1a1a;border-radius:50%;animation:forge-pulse 0.6s ease-in-out infinite alternate}
.forge-dot:nth-child(2){animation-delay:0.2s}
.forge-dot:nth-child(3){animation-delay:0.4s}
@keyframes forge-pulse{0%{opacity:0.2;transform:scale(0.8)}100%{opacity:1;transform:scale(1.2)}}
.forge-text{font-size:14px;letter-spacing:2px;text-transform:uppercase}
.forge-detail{font-size:11px;opacity:0.5;letter-spacing:0.5px;margin-top:4px}
.forge-result{font-size:12px;letter-spacing:0.3px;text-align:center;line-height:1.6}
.forge-result strong{font-size:13px;letter-spacing:0.5px}
.uid-hex{font-size:11px;word-break:break-all;letter-spacing:0.5px;opacity:0.6;margin-top:4px;font-family:inherit}

.anchor-result{text-align:center;line-height:1.8;font-size:12px;letter-spacing:0.3px}
.anchor-result strong{font-size:13px}
.stamp-mark{display:inline-block;border:2px solid #8b1a1a;color:#8b1a1a;padding:4px 16px;font-size:11px;font-weight:700;letter-spacing:2px;margin-top:6px;transform:rotate(-2deg)}

.integration-display{text-align:center;line-height:1.8}
.integration-display .uid-hex{font-size:12px;opacity:0.7;margin-top:2px}
.integration-final{font-size:15px;font-weight:700;letter-spacing:2px;margin-top:6px;text-transform:uppercase}

.cert-card{
  border:2px solid #1a1a1a;width:100%;max-width:420px;position:relative;
  background:
    repeating-linear-gradient(
      0deg,transparent,transparent 19px,rgba(26,26,26,0.02) 19px,rgba(26,26,26,0.02) 20px
    );
  margin:0 auto
}
.cert-card::before{
  content:'';position:absolute;top:0;left:8px;right:8px;height:3px;
  background:repeating-linear-gradient(90deg,#1a1a1a 0,#1a1a1a 2px,transparent 2px,transparent 6px)
}
.cert-header{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:14px 16px 6px;border-bottom:1px solid rgba(26,26,26,0.15)
}
.cert-title{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.cert-id{font-size:9px;letter-spacing:1px;opacity:0.3;font-family:inherit}
.cert-body{padding:12px 16px 14px}
.cert-field{margin-bottom:10px}
.cert-field-label{
  display:block;font-size:9px;letter-spacing:1px;text-transform:uppercase;opacity:0.4;margin-bottom:2px
}
.cert-field-value{
  display:block;font-size:13px;letter-spacing:0.3px;font-weight:700
}
.cert-field-value.uid{font-size:11px;word-break:break-all;letter-spacing:0.5px;opacity:0.7;font-family:inherit}
.cert-field-value.path{font-size:10px;opacity:0.5;letter-spacing:0.3px;font-weight:400;word-break:break-all}
.cert-row{display:flex;gap:16px;margin-bottom:6px}
.cert-row .cert-field{flex:1;margin-bottom:0}
.cert-divider{border-top:1px solid rgba(26,26,26,0.15);margin:10px 0 8px}
.cert-stamp{
  display:inline-block;border:2px solid #8b1a1a;color:#8b1a1a;
  padding:3px 14px;font-size:10px;font-weight:700;letter-spacing:2px;
  transform:rotate(-2deg);margin-top:6px
}
.cert-footer{
  display:flex;justify-content:space-between;
  border-top:2px solid #1a1a1a;padding:6px 16px;
  font-size:8px;letter-spacing:1px;text-transform:uppercase;opacity:0.4
}

.bottom-bar{
  display:flex;align-items:center;justify-content:space-between;
  border:2px solid #1a1a1a;border-top:none;padding:8px 16px;flex-shrink:0;font-size:11px;letter-spacing:0.5px
}
.step-indicators{display:flex;gap:10px;align-items:center}
.step-dot{
  width:22px;height:22px;border:1.5px solid #1a1a1a;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;transition:all 0.4s;
  color:rgba(26,26,26,0.3);background:transparent
}
.step-dot.active{background:#1a1a1a;color:#f5f0e8}
.step-dot.done{background:rgba(26,26,26,0.15);color:#1a1a1a}
.step-label{font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;min-width:140px;text-align:right}

.particles-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:50}
.particle{
  position:fixed;width:2.5px;height:2.5px;background:#1a1a1a;border-radius:50%;
  pointer-events:none;animation:particle-fly 1.8s ease-out forwards;z-index:50
}
@keyframes particle-fly{
  0%{transform:translate(0,0) scale(1);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(0.3);opacity:0}
}

@keyframes cube-idle{
  0%{transform:rotateX(-25deg) rotateY(-35deg)}
  50%{transform:rotateX(-23deg) rotateY(-30deg)}
  100%{transform:rotateX(-25deg) rotateY(-35deg)}
}
.cube.idle{animation:cube-idle 8s ease-in-out infinite}

.blink{animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}

@media(max-width:640px){
  .drawing-sheet{padding:0 8px}
  .title-block{flex-direction:column;gap:4px;padding:8px 12px}
  .cube{width:130px;height:130px}
  .face{width:130px;height:130px}
  .face.front{transform:translateZ(65px)}
  .face.back{transform:rotateY(180deg) translateZ(65px)}
  .face.right{transform:rotateY(90deg) translateZ(65px)}
  .face.left{transform:rotateY(-90deg) translateZ(65px)}
  .face.top{transform:rotateX(-90deg) translateZ(65px)}
  .face.bottom{transform:rotateX(90deg) translateZ(65px)}
  .annotation-box{padding:12px 14px}
  .covenant-box{padding:12px 14px}
  .ritual-input{min-width:140px;font-size:16px}
  .step-dot{width:18px;height:18px;font-size:9px}
  .cert-card{max-width:100%}
  .cert-row{flex-direction:column;gap:6px}
}
</style>
</head>
<body>
<div class="drawing-sheet">
  <div class="title-block">
    <div class="title-main">
      <span class="project-name">Gleipnir IPC</span>
      <span class="sheet-number">FOLHA 1/1</span>
    </div>
    <div class="title-sub">Vinculative Oath</div>
  </div>
  <div class="info-row">
    <div class="info-item" id="info-company">COMPANY: <span>—</span></div>
    <div class="info-item" id="info-network">NETWORK: <span>—</span></div>
  </div>

  <main class="drawing-area">
    <div class="cube-wrapper">
      <div class="cube idle" id="cube">
        <div class="face front" data-face="0"><span class="face-label">Register</span></div>
        <div class="face right" data-face="1"><span class="face-label">Declare</span></div>
        <div class="face top" data-face="2"><span class="face-label">Affirm</span></div>
        <div class="face back" data-face="3"><span class="face-label">Derive</span></div>
        <div class="face left" data-face="4"><span class="face-label">Notarise</span></div>
        <div class="face bottom" data-face="5"><span class="face-label">Complete</span></div>
      </div>
    </div>

    <div class="annotation-area" id="annotation-area">
      <div class="annotation-connector" id="annotation-connector"></div>
      <div class="annotation-box" id="annotation-box">
        <div id="annotation-body"></div>
      </div>
    </div>
  </main>

  <footer class="bottom-bar">
    <div class="step-indicators" id="step-indicators">
      <span class="step-dot" data-step="0">1</span>
      <span class="step-dot" data-step="1">2</span>
      <span class="step-dot" data-step="2">3</span>
      <span class="step-dot" data-step="3">4</span>
      <span class="step-dot" data-step="4">5</span>
      <span class="step-dot" data-step="5">6</span>
    </div>
    <div class="step-label" id="step-label">Register</div>
  </footer>
</div>

<div class="particles-container" id="particles"></div>

<script>
const STEP_LABELS = ['Register','Declare','Affirm','Derive','Notarise','Complete'];
const COVENANT_TEXT = `BINDING AFFIRMATION

The signatory agrees to the following terms:

1. A unique identifier (UID) will be derived from the
   organisation root key, scoped to the declared
   identity and role within this node.

2. All actions performed under this UID are anchored
   to the immutable provenance chain and are
   verifiable by any network participant.

3. The UID and its anchored actions persist as a
   permanent record, irrespective of the signatory's
   continued presence.

Acceptance constitutes consent to this binding.`;

const state = {step:0,name:'',role:'',uid:null,anchor:null,companyUID:null,gleipnirOK:false,busy:false};

function dom(id){return document.getElementById(id)}
const cube = dom('cube');
const bodyEl = dom('annotation-body');
const box = dom('annotation-box');
const connector = dom('annotation-connector');
const stepLabel = dom('step-label');
const infoCompany = dom('info-company');
const infoNetwork = dom('info-network');

function qs(s,p){return(p||document).querySelector(s)}
function qsa(s,p){return(p||document).querySelectorAll(s)}

function highlightFace(idx){
  qsa('.face').forEach(f=>f.classList.toggle('active',parseInt(f.dataset.face)===idx))
}

function updateIndicators(){
  qsa('.step-dot').forEach(d=>{
    const i=parseInt(d.dataset.step);
    d.classList.toggle('active',i===state.step);
    d.classList.toggle('done',i<state.step);
  });
  stepLabel.textContent=STEP_LABELS[state.step];
}

function showAnnotation(html){
  bodyEl.innerHTML=html;
  requestAnimationFrame(()=>{box.classList.add('visible');connector.classList.add('visible')});
}

function hideAnnotation(){
  box.classList.remove('visible');connector.classList.remove('visible')
}

function advance(){
  if(state.busy||state.step>=5)return;
  hideAnnotation();
  setTimeout(()=>{
    state.step++;
    showStep(state.step);
  },400);
}

function showStep(idx){
  state.step=idx;
  highlightFace(idx);
  updateIndicators();
  setTimeout(()=>renderStep(idx),100);
}

function renderStep(idx){
  switch(idx){
    case 0: renderInvocation();break;
    case 1: renderPurpose();break;
    case 2: renderCovenant();break;
    case 3: renderForging();break;
    case 4: renderSeal();break;
    case 5: renderIntegration();break;
  }
}

function renderInvocation(){
  const h='<div class="ritual-text">NAME:<br><input class="ritual-input" id="input-name" placeholder="your name" autocomplete="off"></div><div class="ritual-hint">— state your identity —</div>';
  showAnnotation(h);
  const inp=dom('input-name');
  if(state.name){inp.value=state.name}
  setTimeout(()=>inp.focus(),500);
  inp.addEventListener('keydown',function onKey(e){
    if(e.key==='Enter'&&this.value.trim()){
      state.name=this.value.trim();
      advance();
    }
  });
}

function renderPurpose(){
  const h='<div class="ritual-text">FUNCTION:<br><input class="ritual-input" id="input-role" placeholder="your role" autocomplete="off"></div><div class="ritual-hint">— declare your function —</div>';
  showAnnotation(h);
  const inp=dom('input-role');
  if(state.role){inp.value=state.role}
  setTimeout(()=>inp.focus(),500);
  inp.addEventListener('keydown',function onKey(e){
    if(e.key==='Enter'&&this.value.trim()){
      state.role=this.value.trim();
      advance();
    }
  });
}

function renderCovenant(){
  const h='<div class="covenant-box"><div class="covenant-title">BINDING AFFIRMATION</div><div class="covenant-text" id="covenant-text"></div><div class="covenant-seal"><span class="seal-label" id="seal-label">accept terms</span><div class="seal-button" id="seal-button"><span class="seal-check">✦</span></div></div></div>';
  showAnnotation(h);
  const textEl=dom('covenant-text');
  typeText(textEl,COVENANT_TEXT,18);
  function onSeal(){
    if(dom('seal-button').classList.contains('applied'))return;
    dom('seal-button').classList.add('applied');
    dom('seal-label').textContent='accepted';
    setTimeout(advance,1000);
  }
  dom('seal-button').addEventListener('click',onSeal);
  dom('seal-label').addEventListener('click',onSeal);
}

function renderForging(){
  state.busy=true;
  const h='<div class="forge-animation"><div class="forge-text">Deriving Key</div><div class="forge-spinner"><span class="forge-dot"></span><span class="forge-dot"></span><span class="forge-dot"></span></div><div class="forge-detail">HKDF-Expand(HMAC-SHA256 · hierarchical derivation)</div><div class="forge-result" id="forge-result"></div></div>';
  showAnnotation(h);
  const resultEl=dom('forge-result');
  spawnParticles();
  fetch('/api/derive',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:state.name,role:state.role})
  }).then(r=>r.json()).then(data=>{
    state.uid=data;
    const pathStr=data.derivation_path.map(p=>p.label+'['+p.index+']').join(' → ');
    resultEl.innerHTML='<strong>UID derived</strong><br><span class="uid-hex">'+data.uid_id+'</span><br><span style="font-size:10px;opacity:0.4">'+pathStr+'</span>';
    setTimeout(()=>{state.busy=false;advance()},2000);
  }).catch(err=>{
    resultEl.innerHTML='<span style="color:#8b1a1a">error: '+err.message+'</span>';
    state.busy=false;
  });
}

function renderSeal(){
  state.busy=true;
  const h='<div class="forge-animation"><div class="forge-text">Notarising to Chain</div><div class="forge-spinner"><span class="forge-dot"></span><span class="forge-dot"></span><span class="forge-dot"></span></div><div class="forge-detail">context record → BLAKE3 → POST /v1/submit</div><div class="anchor-result" id="anchor-result"></div></div>';
  showAnnotation(h);
  const resultEl=dom('anchor-result');
  fetch('/api/anchor',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({uid_id:state.uid.uid_id,name:state.name,role:state.role})
  }).then(r=>r.json()).then(data=>{
    state.anchor=data;
    resultEl.innerHTML='<strong>Notarised</strong><br>block #'+data.block_index+' · root: <span style="font-size:10px;opacity:0.6">'+data.state_root.slice(0,16)+'…</span><br><div class="stamp-mark">VERIFIED</div>';
    setTimeout(()=>{state.busy=false;advance()},2200);
  }).catch(err=>{
    resultEl.innerHTML='<span style="color:#8b1a1a">error: '+err.message+'</span>';
    state.busy=false;
  });
}

function renderIntegration(){
  const pathStr=state.uid.derivation_path.map(p=>p.label+'['+p.index+']').join(' → ');
  const blockInfo=state.anchor?'#'.concat(state.anchor.block_index).concat(' · ').concat(state.anchor.state_root.slice(0,10)).concat('…'):'pending';
  const h='<div class="cert-card"><div class="cert-header"><span class="cert-title">Identity Certificate</span><span class="cert-id">UID-001</span></div><div class="cert-body"><div class="cert-field"><span class="cert-field-label">UID</span><span class="cert-field-value uid">'+state.uid.uid_id+'</span></div><div class="cert-row"><div class="cert-field"><span class="cert-field-label">Name</span><span class="cert-field-value">'+state.name+'</span></div><div class="cert-field"><span class="cert-field-label">Role</span><span class="cert-field-value">'+state.role+'</span></div></div><div class="cert-field"><span class="cert-field-label">Derivation</span><span class="cert-field-value path">'+pathStr+'</span></div><div class="cert-divider"></div><div class="cert-field"><span class="cert-field-label">Anchor</span><span class="cert-field-value">block '+blockInfo+'</span></div><div class="cert-stamp">VERIFIED</div></div><div class="cert-footer"><span>Gleipnir IPC</span><span>cube room</span></div></div>';
  showAnnotation(h);
  spawnParticles();
}

function fetchStatus(){
  fetch('/api/status').then(r=>r.json()).then(d=>{
    state.companyUID=d.company_uid;
    state.gleipnirOK=d.gleipnir;
    infoCompany.innerHTML='COMPANY: <span>'+d.company_uid.slice(0,12)+'…</span>';
    infoNetwork.innerHTML='NETWORK: <span>'+(d.gleipnir?'active':'unavailable')+'</span>';
    infoNetwork.className='info-item'+(d.gleipnir?' online':' offline');
  }).catch(()=>{
    infoNetwork.innerHTML='NETWORK: <span>unavailable</span>';
    infoNetwork.className='info-item offline';
  });
}

function typeText(el,text,speed){
  let i=0;el.textContent='';
  function t(){
    if(i<text.length){
      el.textContent+=text[i];
      i++;
      setTimeout(t,speed+Math.random()*10);
    }
  }
  t();
}

function spawnParticles(){
  const c=dom('particles');const rect=cube.getBoundingClientRect();
  const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  for(let i=0;i<35;i++){
    setTimeout(()=>{
      const p=document.createElement('div');p.className='particle';
      const a=Math.random()*Math.PI*2,d=40+Math.random()*130;
      p.style.setProperty('--dx',Math.cos(a)*d+'px');
      p.style.setProperty('--dy',Math.sin(a)*d+'px');
      p.style.left=(cx+(Math.random()-0.5)*30)+'px';
      p.style.top=(cy+(Math.random()-0.5)*30)+'px';
      c.appendChild(p);
      setTimeout(()=>p.remove(),2000);
    },i*35);
  }
}

init();
function init(){
  fetchStatus();
  setTimeout(()=>showStep(0),400);
}
</script>
