// Immutable Provenance Chain (IPC) protocol — gRPC API.
// Gleipnir is the reference implementation.
syntax = "proto3";
package provenance;
option go_package = "github.com/had-nu/gleipnir/v2/pkg/server/pb";

service ProvenanceAnchor {
  rpc SubmitHash(SubmitRequest) returns (SubmitResponse);
  rpc WaitForAnchor(WaitRequest) returns (AnchorProof);
  rpc VerifyHash(VerifyRequest) returns (AnchorProof);
  rpc GetCurrentStateRoot(Empty) returns (StateRootResponse);
  rpc GetHealth(Empty) returns (HealthResponse);
  rpc GetBlock(BlockRequest) returns (Block);
  rpc StreamBlocks(BlockRange) returns (stream Block);
  // GetValidatorSet and GetMerkleProof are the remaining SPEC §12.2 read operations a
  // light client needs: the validator set to check signatures against, and proofs that an
  // entry is in the tree a given block committed to.
  rpc GetValidatorSet(ValidatorSetRequest) returns (ValidatorSetResponse);
  rpc GetMerkleProof(MerkleProofRequest) returns (MerkleProofResponse);
  // SubmitKeyRotation rotates this node's validator signing key (SPEC §8).
  rpc SubmitKeyRotation(KeyRotationRequest) returns (KeyRotationResponse);
  // GetActivePublicKey reports which validator keys are authoritative in a cycle,
  // which is two during a rotation's overlap window (SPEC §8).
  rpc GetActivePublicKey(ActiveKeyRequest) returns (ActiveKeyResponse);

  // Mandate compliance (SPEC §13).
  //
  // A mandate states what MUST be anchored, so an auditor can later compare the chain
  // against the obligation. SubmitMandate installs one; CheckCompliance asks whether
  // the chain so far has honoured it over a window.
  rpc SubmitMandate(MandateRequest) returns (MandateResponse);
  rpc CheckCompliance(ComplianceCheckRequest) returns (ComplianceReport);
  rpc GetActiveMandates(GetActiveMandatesRequest) returns (GetActiveMandatesResponse);
  rpc GetMandate(GetMandateRequest) returns (GetMandateResponse);
}

// KeyRotationRequest asks the node to rotate its own validator key.
//
// signature_new is the incoming key's signature over the canonical rotation payload
// and is REQUIRED: SPEC §8.2 rule 2 demands the incoming key sign the rotation, and
// only the holder of that secret key can produce it. The node signs with its outgoing
// key (rule 1) and never receives the incoming secret key, so a validator can rotate
// to a key held in an HSM or KMS. Clients compute the payload bytes with
// chain.KeyRotationPayloadFor and sign them with the new Dilithium3 key.
message KeyRotationRequest {
  bytes  new_dilithium_public_key = 1;  // 1952 bytes
  bytes  new_vrf_public_key      = 2;  // 32 bytes (Ristretto255)
  uint64 effective_cycle         = 3;
  uint64 expiry_cycle            = 4;
  bytes  signature_new           = 5;  // signature by the incoming key
}

message KeyRotationResponse {
  bytes  entry_hash    = 1;
  string status        = 2;  // "pending", "accepted" or "rejected"
  string error         = 3;
  string error_code    = 4;
  uint64 effective_cycle = 5;
  uint64 expiry_cycle    = 6;
}

message ActiveKeyRequest {
  bytes  validator_id = 1;  // 16 bytes; empty means this node
  uint64 cycle        = 2;
}

message ActiveKeyResponse {
  repeated bytes public_keys = 1;  // ordered: outgoing first, then incoming
  bool           in_overlap   = 2;
}

message SubmitRequest {
  bytes  hash       = 1;
  bytes  submitter  = 2;
  bytes  signature  = 3;
  int64  timestamp  = 4;
  string label      = 5;
  bytes  approver   = 6;
  bytes  reference  = 7;
}

message SubmitResponse {
  bytes  tx_id       = 1;
  bool   accepted    = 2;
  string status      = 3;
  uint64 block_index = 4;
  int64  block_time  = 5;
  string error_code  = 6;
}

message WaitRequest {
  bytes hash = 1;
}

message AnchorProof {
  bool   found           = 1;
  uint64 block_index     = 2;
  int64  block_time      = 3;
  bytes  state_root      = 4;
  bytes  smt_proof       = 5;
  bytes  submitter       = 6;
  string label           = 7;
}

message VerifyRequest {
  bytes hash = 1;
}

message Empty {}

message StateRootResponse {
  bytes  state_root    = 1;
  uint64 block_index   = 2;
  float  lambda1       = 3;
}

message HealthResponse {
  string node_id       = 1;
  string status        = 2;
  uint64 block_height  = 3;
  bytes  current_root  = 4;
  float  lambda1       = 5;
  uint32 active_peers  = 6;
  uint32 total_peers   = 7;
  uint64 pending_hashes = 8;
  float  avg_tps       = 9;
}

message BlockRequest {
  uint64 index = 1;
}

message BlockRange {
  uint64 from = 1;
  uint64 to   = 2;
}

// ValidatorInfo is one entry of the canonical validator set (SPEC §7.1).
//
// The VRFPK and ContractHash are not decoration. §7.2 MUSTs that VRFProof verification
// uses the peer's VRFPK taken from network state, so a client given only Dilithium3
// public keys has nowhere to get it and cannot verify a VRF proof at all.
message ValidatorInfo {
  bytes validator_id  = 1;
  bytes dilithium3_pk = 2;  // 1952 bytes
  bytes vrf_pk        = 3;  // 32 bytes
  bytes contract_hash = 4;  // 32 bytes
}

// QuorumConfig carries the block's own statement of how many signatures it needed.
message QuorumConfig {
  uint64 total_validators = 1;
  uint64 required_sigs    = 2;
}

// Block mirrors spec/schemas/block.cddl.
//
// This replaces an earlier, partial message that exposed only the v1-era fields and
// nothing a v2 client needs. Two of its problems were not merely omissions:
//
//   - It had a `sigs` field, which is where v1 kept block signatures without phase
//     distinction. §5.3 reserves key 8 for ProtocolVersion == 2 and forbids signatures
//     there, so a client reading `sigs` for PREPARE signatures would be reading a field
//     the specification says must not exist.
//   - GetBlock filled `block_hash` by recomputing it from the block's contents. That made
//     every response self-consistent, so a client could not tell whether the block's
//     stored hash matched what it was given -- which is precisely the check a light client
//     performs. The stored value is now returned unchanged and the client verifies.
//
// Field numbers are protobuf's own namespace, which forbids zero, so they run
// sequentially in CBOR key order rather than matching the keys exactly. Each field's
// comment names the key it corresponds to.
//
// This is a breaking change to the gRPC surface and lands with the v2 chain reset.
message Block {
  uint64              index           = 1;  // CBOR key 0
  bytes               prev_hash       = 2;  // key 1
  bytes               state_root      = 3;  // key 2
  bytes               proposer        = 4;  // key 3
  // key 4 (Triad) is reserved and never present in a v2 block.
  repeated ProvenanceEntry anchored    = 5;  // key 5
  double              lambda1         = 6;  // key 6
  int64               timestamp       = 7;  // key 7
  // key 8 is reserved in ProtocolVersion == 2 and carries no signatures.
  repeated ValidatorInfo validators    = 8;  // key 9
  QuorumConfig        quorum          = 9;  // key 10
  bytes               block_hash      = 10; // key 11, as stored, not recomputed

  uint32 protocol_version    = 11; // key 12
  bytes  prepare_sigs_bitmap = 12; // key 13
  // prepare_sigs is the sole PREPARE-signature field in v2. It is compacted: it holds only
  // the signatures whose validator has its bit set in prepare_sigs_bitmap, in ascending
  // validator order, so payload position i belongs to the i-th set bit and not to
  // validator i.
  repeated bytes prepare_sigs = 13; // key 14
  bytes  commit_sig           = 14; // key 15, leader's signature over block_hash
  repeated string external_anchors = 15; // key 16
  uint64 key_rotation_epoch   = 16; // key 17
  bytes  legacy_anchor        = 17; // key 18, genesis only
  map<string, bytes> metadata = 18; // key 19, e.g. "3cp:degraded-block"
}

message ProvenanceEntry {
  bytes  hash       = 1;
  bytes  submitter  = 2;
  int64  timestamp  = 3;
  string label      = 4;
  bytes  approver   = 5;
  bytes  reference  = 6;
  bytes  signature  = 7;
  bytes  mandate_ref = 8;
}

// ValidatorSetRequest asks for the canonical validator set of a cycle.
//
// A light client must be able to obtain this without trusting a single node's account of
// who is entitled to sign, so the set is served from the node's own validator set rather
// than read out of any block. Block 0 is where a client is expected to take its initial
// trust from.
message ValidatorSetRequest {
  // cycle is the consensus cycle. Zero means the node's current cycle.
  uint64 cycle = 1;
}

message ValidatorSetResponse {
  repeated ValidatorInfo validators = 1;
}

// MerkleProofRequest asks for an inclusion proof of a key in the state tree.
message MerkleProofRequest {
  bytes  key        = 1;  // 32 bytes
  uint64 block_index = 2; // the block whose state root the proof is to be checked against
}

// MerkleProofResponse returns the proof and the root it must be checked against.
//
// The root is the block's, not the tree's current one. A proof against today's tree says
// nothing about an older block, so pairing them would let a client believe an entry is in
// a block it was never anchored to.
message MerkleProofResponse {
  repeated bytes proof = 1;
  bytes         root  = 2;  // the StateRoot of block_index, 32 bytes
}

// MandateRequest submits a mandate entry, canonical CBOR per
// spec/schemas/mandate.cddl.
//
// The node verifies the embedded signature, recomputes the identifier and refuses
// anything that does not match, so a client cannot assert an identifier that does not
// commit to the rules it appears to carry.
message MandateRequest {
  bytes mandate = 1;  // canonical CBOR of a chain.MandateEntry
}

// MandateResponse echoes the accepted mandate.
message MandateResponse {
  bytes mandate_id = 1;
  uint64 version   = 2;
}

// ComplianceCheckRequest asks whether a mandate was honoured over a window.
//
// The window is given in both wall-clock and cycle terms. Cycles bound which blocks
// are scanned; timestamps bound when the obligations were due. start_cycle and
// end_cycle are optional and default to the whole chain.
message ComplianceCheckRequest {
  bytes  mandate_id      = 1;
  int64  start_timestamp = 2;
  int64  end_timestamp   = 3;
  uint64 start_cycle     = 4;
  uint64 end_cycle       = 5;
}

// ComplianceGap is one detected omission. The field names and numbering follow
// compliance-gap in spec/schemas/mandate.cddl.
message ComplianceGap {
  bytes   mandate_id             = 1;
  uint32  rule_index             = 2;
  string  event_class            = 3;
  int64   expected_window_start  = 4;
  int64   expected_window_end    = 5;
  string  status                 = 6;  // anchored | missing | missing_fields
  string  details                = 7;
  // The schema's compliance-gap has no such field; it is reported alongside status
  // "missing_fields" so a caller can see which required fields were absent.
  repeated string missing_fields = 8;
}

// ComplianceReport is the result of verifying one mandate over one window, mirroring
// compliance-verification in spec/schemas/mandate.cddl plus the derived rate.
message ComplianceReport {
  bytes   mandate_id      = 1;
  string  mandate_label   = 2;
  int64   start_timestamp = 3;
  int64   end_timestamp   = 4;
  uint32  total_expected  = 5;
  uint32  total_anchored  = 6;
  double  compliance_rate = 7;
  repeated ComplianceGap gaps = 8;
  int64   timestamp       = 9;
}

message GetActiveMandatesRequest {
  // timestamp is the instant to evaluate validity windows at. Zero means now.
  int64 timestamp = 1;
}

message GetActiveMandatesResponse {
  // mandates holds canonical CBOR MandateEntry encodings.
  repeated bytes mandates = 1;
}

message GetMandateRequest {
  bytes mandate_id = 1;
}

message GetMandateResponse {
  bytes mandate = 1;  // canonical CBOR of a chain.MandateEntry
}
