// Immutable Provenance Chain (IPC) protocol — gRPC API.
// Gleipnir is the reference implementation.
syntax = "proto3";
package provenance;
option go_package = "github.com/had-nu/gleipnir/v2/pkg/server/pb";

service ProvenanceAnchor {
  rpc SubmitHash(SubmitRequest) returns (SubmitResponse);
  rpc WaitForAnchor(WaitRequest) returns (AnchorProof);
  rpc VerifyHash(VerifyRequest) returns (AnchorProof);
  rpc GetCurrentStateRoot(Empty) returns (StateRootResponse);
  rpc GetHealth(Empty) returns (HealthResponse);
  rpc GetBlock(BlockRequest) returns (Block);
  rpc StreamBlocks(BlockRange) returns (stream Block);
  // SubmitKeyRotation rotates this node's validator signing key (SPEC §8).
  rpc SubmitKeyRotation(KeyRotationRequest) returns (KeyRotationResponse);
  // GetActivePublicKey reports which validator keys are authoritative in a cycle,
  // which is two during a rotation's overlap window (SPEC §8).
  rpc GetActivePublicKey(ActiveKeyRequest) returns (ActiveKeyResponse);

  // Mandate compliance (SPEC §13).
  //
  // A mandate states what MUST be anchored, so an auditor can later compare the chain
  // against the obligation. SubmitMandate installs one; CheckCompliance asks whether
  // the chain so far has honoured it over a window.
  rpc SubmitMandate(MandateRequest) returns (MandateResponse);
  rpc CheckCompliance(ComplianceCheckRequest) returns (ComplianceReport);
  rpc GetActiveMandates(GetActiveMandatesRequest) returns (GetActiveMandatesResponse);
  rpc GetMandate(GetMandateRequest) returns (GetMandateResponse);
}

// KeyRotationRequest asks the node to rotate its own validator key.
//
// signature_new is the incoming key's signature over the canonical rotation payload
// and is REQUIRED: SPEC §8.2 rule 2 demands the incoming key sign the rotation, and
// only the holder of that secret key can produce it. The node signs with its outgoing
// key (rule 1) and never receives the incoming secret key, so a validator can rotate
// to a key held in an HSM or KMS. Clients compute the payload bytes with
// chain.KeyRotationPayloadFor and sign them with the new Dilithium3 key.
message KeyRotationRequest {
  bytes  new_dilithium_public_key = 1;  // 1952 bytes
  bytes  new_vrf_public_key      = 2;  // 32 bytes (Ristretto255)
  uint64 effective_cycle         = 3;
  uint64 expiry_cycle            = 4;
  bytes  signature_new           = 5;  // signature by the incoming key
}

message KeyRotationResponse {
  bytes  entry_hash    = 1;
  string status        = 2;  // "pending", "accepted" or "rejected"
  string error         = 3;
  string error_code    = 4;
  uint64 effective_cycle = 5;
  uint64 expiry_cycle    = 6;
}

message ActiveKeyRequest {
  bytes  validator_id = 1;  // 16 bytes; empty means this node
  uint64 cycle        = 2;
}

message ActiveKeyResponse {
  repeated bytes public_keys = 1;  // ordered: outgoing first, then incoming
  bool           in_overlap   = 2;
}

message SubmitRequest {
  bytes  hash       = 1;
  bytes  submitter  = 2;
  bytes  signature  = 3;
  int64  timestamp  = 4;
  string label      = 5;
  bytes  approver   = 6;
  bytes  reference  = 7;
}

message SubmitResponse {
  bytes  tx_id       = 1;
  bool   accepted    = 2;
  string status      = 3;
  uint64 block_index = 4;
  int64  block_time  = 5;
  string error_code  = 6;
}

message WaitRequest {
  bytes hash = 1;
}

message AnchorProof {
  bool   found           = 1;
  uint64 block_index     = 2;
  int64  block_time      = 3;
  bytes  state_root      = 4;
  bytes  smt_proof       = 5;
  bytes  submitter       = 6;
  string label           = 7;
}

message VerifyRequest {
  bytes hash = 1;
}

message Empty {}

message StateRootResponse {
  bytes  state_root    = 1;
  uint64 block_index   = 2;
  float  lambda1       = 3;
}

message HealthResponse {
  string node_id       = 1;
  string status        = 2;
  uint64 block_height  = 3;
  bytes  current_root  = 4;
  float  lambda1       = 5;
  uint32 active_peers  = 6;
  uint32 total_peers   = 7;
  uint64 pending_hashes = 8;
  float  avg_tps       = 9;
}

message BlockRequest {
  uint64 index = 1;
}

message BlockRange {
  uint64 from = 1;
  uint64 to   = 2;
}

message Block {
  uint64              index       = 1;
  bytes               prev_hash   = 2;
  bytes               state_root  = 3;
  bytes               proposer    = 4;
  repeated bytes      triad       = 5;
  repeated ProvenanceEntry anchored = 6;
  double              lambda1     = 7;
  int64               timestamp   = 8;
  repeated bytes      sigs        = 9;
  bytes               block_hash  = 10;
}

message ProvenanceEntry {
  bytes  hash       = 1;
  bytes  submitter  = 2;
  int64  timestamp  = 3;
  string label      = 4;
  bytes  approver   = 5;
  bytes  reference  = 6;
  bytes  signature  = 7;
  bytes  mandate_ref = 8;
}

// MandateRequest submits a mandate entry, canonical CBOR per
// spec/schemas/mandate.cddl.
//
// The node verifies the embedded signature, recomputes the identifier and refuses
// anything that does not match, so a client cannot assert an identifier that does not
// commit to the rules it appears to carry.
message MandateRequest {
  bytes mandate = 1;  // canonical CBOR of a chain.MandateEntry
}

// MandateResponse echoes the accepted mandate.
message MandateResponse {
  bytes mandate_id = 1;
  uint64 version   = 2;
}

// ComplianceCheckRequest asks whether a mandate was honoured over a window.
//
// The window is given in both wall-clock and cycle terms. Cycles bound which blocks
// are scanned; timestamps bound when the obligations were due. start_cycle and
// end_cycle are optional and default to the whole chain.
message ComplianceCheckRequest {
  bytes  mandate_id      = 1;
  int64  start_timestamp = 2;
  int64  end_timestamp   = 3;
  uint64 start_cycle     = 4;
  uint64 end_cycle       = 5;
}

// ComplianceGap is one detected omission. The field names and numbering follow
// compliance-gap in spec/schemas/mandate.cddl.
message ComplianceGap {
  bytes   mandate_id             = 1;
  uint32  rule_index             = 2;
  string  event_class            = 3;
  int64   expected_window_start  = 4;
  int64   expected_window_end    = 5;
  string  status                 = 6;  // anchored | missing | missing_fields
  string  details                = 7;
  // The schema's compliance-gap has no such field; it is reported alongside status
  // "missing_fields" so a caller can see which required fields were absent.
  repeated string missing_fields = 8;
}

// ComplianceReport is the result of verifying one mandate over one window, mirroring
// compliance-verification in spec/schemas/mandate.cddl plus the derived rate.
message ComplianceReport {
  bytes   mandate_id      = 1;
  string  mandate_label   = 2;
  int64   start_timestamp = 3;
  int64   end_timestamp   = 4;
  uint32  total_expected  = 5;
  uint32  total_anchored  = 6;
  double  compliance_rate = 7;
  repeated ComplianceGap gaps = 8;
  int64   timestamp       = 9;
}

message GetActiveMandatesRequest {
  // timestamp is the instant to evaluate validity windows at. Zero means now.
  int64 timestamp = 1;
}

message GetActiveMandatesResponse {
  // mandates holds canonical CBOR MandateEntry encodings.
  repeated bytes mandates = 1;
}

message GetMandateRequest {
  bytes mandate_id = 1;
}

message GetMandateResponse {
  bytes mandate = 1;  // canonical CBOR of a chain.MandateEntry
}
